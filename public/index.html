<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <title>Test_Cris.V</title>
</head>

<body>
    <div id="stats">
        <div id="shapesCount" class="stats-box">Number of current shapes: 0</div>
        <div id="areaUsed" class="stats-box">Surface occupied by shapes: 0 </div>
    </div>

    <div id="controls">
        <div class="ctrl-group">
            <button id="spawnMinus" class="ctrl-btn">-</button>
            <span class="ctrl-label">Shapes/sec: <span id="spawnValue">1.0</span></span>
            <button id="spawnPlus" class="ctrl-btn">+</button>
        </div>

        <div class="ctrl-group">
            <button id="gravMinus" class="ctrl-btn">-</button>
            <span class="ctrl-label">Gravity: <span id="gravValue">1400</span></span>
            <button id="gravPlus" class="ctrl-btn">+</button>
        </div>
    </div>


    <div id="app">
        <div id="pixi-container"></div>
    </div>

    <script type="module" src="./bundle.min.js"></script>
</body>

</html>
